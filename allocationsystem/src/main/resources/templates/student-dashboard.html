<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            resize: vertical;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .info {
            color: #666;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>College Room Booking System</h2>
    <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
        <button type="submit" class="logout" style="background: none; border: none; font-size: inherit; font-family: inherit; cursor: pointer; padding: 0;">Logout</button>
    </form>
</div>

<div class="container">

    <div class="welcome">
        <h1>Student Dashboard</h1>
        <p>Request a room for your academic activities.</p>
    </div>

    <!-- Booking Request -->
    <div class="card">

        <h3>Request a Room</h3>

        <form action="/student/bookings" method="post">

            <div class="form-group">
                <label for="room">Select Room</label>

                <select id="room" name="roomId" required>

                    <option value="">
                        -- Select a room --
                    </option>

                    <option th:each="room : ${rooms}"
                            th:value="${room.id}"
                            th:text="${room.name + ' - ' + room.building + ' (Capacity: ' + room.capacity + ')'}">
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>

                <input type="date"
                       id="date"
                       name="date"
                       required>
            </div>

            <div class="form-group">
                <label for="startTime">Start Time</label>

                <input type="time"
                       id="startTime"
                       name="startTime"
                       required>
            </div>

            <div class="form-group">
                <label for="endTime">End Time</label>

                <input type="time"
                       id="endTime"
                       name="endTime"
                       required>
            </div>

            <div class="form-group">
                <label for="purpose">Purpose</label>

                <textarea id="purpose"
                          name="purpose"
                          rows="4"
                          placeholder="Enter the purpose of the booking"
                          required></textarea>
            </div>

            <button type="submit">
                Submit Booking Request
            </button>

        </form>

    </div>

<!-- My Bookings -->
<div class="card">

    <h3>My Bookings</h3>

    <div th:if="${#lists.isEmpty(myBookings)}">
        <p class="info">
            You have not submitted any booking requests yet.
        </p>
    </div>

    <table th:unless="${#lists.isEmpty(myBookings)}"
           style="width: 100%; border-collapse: collapse;">

        <thead>
        <tr>
            <th style="padding: 10px; text-align: left;">Room</th>
            <th style="padding: 10px; text-align: left;">Date</th>
            <th style="padding: 10px; text-align: left;">Time</th>
            <th style="padding: 10px; text-align: left;">Purpose</th>
            <th style="padding: 10px; text-align: left;">Status</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="booking : ${myBookings}">

            <td style="padding: 10px;"
                th:text="${booking.room.name}">
                Room
            </td>

            <td style="padding: 10px;"
                th:text="${booking.date}">
                Date
            </td>

            <td style="padding: 10px;"
                th:text="${booking.startTime + ' - ' + booking.endTime}">
                Time
            </td>

            <td style="padding: 10px;"
                th:text="${booking.purpose}">
                Purpose
            </td>

            <td style="padding: 10px;"
                th:text="${booking.status}">
                PENDING
            </td>

        </tr>

        </tbody>

    </table>

</div>

</div>

</body>
</html>
